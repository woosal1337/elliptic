# Capture tour of the Elliptic app itself, for before/after redesign diffing.
# Platform-agnostic — runs on whichever device the runner targets. The app is
# currently built for iOS; add Android once `expo run:android` is wired.
#
# Run:  scripts/maestro.sh ios .maestro/capture/elliptic-tour.yaml
appId: sh.elliptic
---
- launchApp
- waitForAnimationToEnd
# Dismiss first-launch overlays if present (dev-client onboarding, save-password).
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/elliptic/00-home
- tapOn: "Tasks"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/elliptic/01-tasks
- tapOn: "Notes"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/elliptic/02-notes
- tapOn: "Inbox"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/elliptic/03-inbox
- tapOn: "Profile"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/elliptic/04-profile
