# Capture tour of the CompanyOS app itself, for before/after redesign diffing.
# Platform-agnostic — runs on whichever device the runner targets. The app is
# currently built for iOS; add Android once `expo run:android` is wired.
#
# Run:  scripts/maestro.sh ios .maestro/capture/companyos-tour.yaml
appId: com.companyos
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/companyos/00-home
- tapOn:
    text: "Tasks, tab.*"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/companyos/01-tasks
- tapOn:
    text: "Notes, tab.*"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/companyos/02-notes
- tapOn:
    text: "Inbox, tab.*"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/companyos/03-inbox
- tapOn:
    text: "Profile, tab.*"
- waitForAnimationToEnd
- takeScreenshot: .maestro/output/companyos/04-profile
