#flow: Login
#intent: sign into Elliptic with credentials injected via env (never hardcoded).
# Run: MAESTRO_EMAIL=... MAESTRO_PASSWORD=... scripts/maestro.sh ios .maestro/flows/Login.yaml
appId: sh.elliptic
---
- launchApp
- waitForAnimationToEnd
# First launch of the Expo dev client shows a dev-menu onboarding sheet.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn:
          point: "90%, 45%"
- assertVisible: "Sign in to your workspace"
- tapOn:
    text: "you@company.com"
- inputText: ${MAESTRO_EMAIL}
# The password field has no placeholder text of its own on Android, so it is
# addressed by position: the field directly below the email one.
- tapOn:
    below:
      text: "Password"
- inputText: ${MAESTRO_PASSWORD}
# hideKeyboard is flaky on iOS; the button is reachable with the keyboard up.
- tapOn: "Sign in"
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000
# iOS may offer to save the typed password; decline so runs stay deterministic.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
