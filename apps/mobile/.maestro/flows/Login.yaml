#flow: Login
#intent: sign into Elliptic with credentials injected via env (never hardcoded).
# Run: MAESTRO_EMAIL=... MAESTRO_PASSWORD=... scripts/maestro.sh ios .maestro/flows/Login.yaml
appId: sh.elliptic
---
- launchApp
- waitForAnimationToEnd
# First launch of the Expo dev client shows a dev-menu onboarding sheet.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - tapOn:
          point: "90%, 45%"
- assertVisible: "Sign in to your workspace"
# Each field is one accessibility element carrying a combined label — the
# hierarchy reads "Email, you@company.com" and "Password, ••••••••". Maestro
# full-matches its text regex, so the bare placeholder never matches and there
# is no element labelled exactly "Password" to sit `below:`.
- tapOn: "Email, .*"
# The simulator keeps an autofilled password in the field. Without erasing,
# the typed one is appended to it and the sign-in fails.
- eraseText
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password, .*"
- eraseText
- inputText: ${MAESTRO_PASSWORD}
# hideKeyboard is flaky on iOS; the button is reachable with the keyboard up.
- tapOn: "Sign in"
- extendedWaitUntil:
    visible:
      text: "Home"
    timeout: 15000
# iOS may offer to save the typed password; decline so runs stay deterministic.
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
