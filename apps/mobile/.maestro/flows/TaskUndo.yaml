#flow: TaskUndo
#intent: toast behaviour on task writes — undo restores the previous status, and a
#        second write queues behind the first instead of replacing it.
#        Every write it makes is undone, so the QA fixture ends where it started.
#
#NOTE: rewritten for the swipe rewrite (SwipeableRow now commits on release and
#      has no resting open position, so there is no revealed button to tap).
#      Each write is a single decisive swipe. NOT YET RUN against the QA fixture
#      — this session is signed in as a different account, so the selectors below
#      are updated but unverified. Run it before trusting it.
appId: sh.elliptic
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- tapOn: "Tasks"
- waitForAnimationToEnd

# --- undo restores the previous status -------------------------------------
# One swipe, no tap: past the arm point the action fires on release. If this
# assertion fails on distance rather than on behaviour, swap the element swipe
# for explicit start/end percentages — the arm point is 24% of the screen width.
- swipe:
    from:
      text: ".*Day-group the inbox feed.*"
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible:
    id: "toast"
- takeScreenshot: .maestro/output/elliptic/07-toast-undo
- tapOn:
    id: "toast-action"
- extendedWaitUntil:
    notVisible:
      id: "toast"
    timeout: 8000
- takeScreenshot: .maestro/output/elliptic/08-after-undo

# --- two writes in a row: the second toast waits its turn -------------------
- swipe:
    from:
      text: ".*Streaming assistant responses.*"
    direction: RIGHT
- waitForAnimationToEnd
- swipe:
    from:
      text: ".*Secure token storage via Keychain.*"
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: "MOB-7 .* Done"
- takeScreenshot: .maestro/output/elliptic/09-toast-queue
- tapOn:
    id: "toast-action"
- assertVisible: "MOB-6 .* Done"
- tapOn:
    id: "toast-action"
- extendedWaitUntil:
    notVisible:
      id: "toast"
    timeout: 8000
