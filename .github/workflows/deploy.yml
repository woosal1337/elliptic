name: Deploy

# Auto-deploy to the self-hosted ct104 server after CI passes on main.
#
# ct104 hosts the stack as a git checkout at /opt/companyos and builds the
# images locally (companyos-api:local / companyos-web:local) via
# docker-compose.yml + a host-managed docker-compose.override.yml (which holds
# restart policies, prod OAUTH_ISSUER/MCP_RESOURCE_BASE) and a host .env — both
# untracked, so `git reset --hard` never touches them. Cloudflare fronts the
# host ports (API_PORT / WEB_PORT from .env). This job just fast-forwards the
# checkout and reconciles the stack, mirroring the manual deploy exactly.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy only when CI actually succeeded (or when triggered by hand).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, ct104]
    env:
      DEPLOY_DIR: /opt/companyos
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Deploy on ct104
        working-directory: /opt/companyos
        run: |
          set -euo pipefail
          echo "Deploying ${DEPLOY_SHA} to ${DEPLOY_DIR}"
          git fetch --prune origin
          git reset --hard "${DEPLOY_SHA}"
          # Rebuild local images and reconcile; the host override + .env supply
          # prod config and survive the reset (they are untracked).
          docker compose up -d --build --remove-orphans
          API_PORT="$(grep -E '^API_PORT=' .env | cut -d= -f2 || true)"
          API_PORT="${API_PORT:-8000}"
          echo "Waiting for api health on 127.0.0.1:${API_PORT}"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:${API_PORT}/api/v1/health" >/dev/null 2>&1; then
              echo "api healthy after $((i*3))s"; ok=1; break
            fi
            sleep 3
          done
          if [ "${ok}" != 1 ]; then
            echo "::error::api did not become healthy"
            docker compose logs --tail=80 api
            exit 1
          fi
          docker image prune -f
