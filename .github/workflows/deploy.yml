name: Deploy

# Auto-deploy to the self-hosted ct104 server after CI passes on main.
#
# ct104 hosts the stack as a git checkout at /opt/companyos and builds the
# images locally (companyos-api:local / companyos-web:local) via
# docker-compose.yml + a host-managed docker-compose.override.yml (which holds
# restart policies, prod OAUTH_ISSUER/MCP_RESOURCE_BASE) and a host .env — both
# untracked, so `git reset --hard` never touches them. Cloudflare fronts the
# host ports (API_PORT / WEB_PORT from .env). This job just fast-forwards the
# checkout and reconciles the stack, mirroring the manual deploy exactly.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Deploy only when CI actually succeeded (or when triggered by hand).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, ct104]
    env:
      DEPLOY_DIR: /opt/companyos
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Deploy on ct104
        working-directory: /opt/companyos
        run: |
          set -euo pipefail
          echo "Deploying ${DEPLOY_SHA} to ${DEPLOY_DIR}"
          git fetch --prune origin
          git reset --hard "${DEPLOY_SHA}"
          # ct104 hosts the API (behind api-company.chele.bi) + Postgres; the web
          # app ships via Vercel, so only the api image is built and recreated
          # here. Building Next.js on this 4 GB box OOM-kills the deploy, and it
          # would be redundant with Vercel anyway. The host override + .env
          # supply prod config and survive the reset (they are untracked).
          #
          # Zero-downtime: the API runs behind an always-up Caddy proxy and is
          # rolled blue-green (start new replica -> health-check -> drain old),
          # so deploys no longer drop web/dashboard/MCP connections. See
          # scripts/deploy-ct104.sh and docker-compose.prod.yml.
          bash scripts/deploy-ct104.sh
